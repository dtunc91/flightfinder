name: Weekly blog post

# Writes one new blog post with Claude every Monday and opens a pull request
# for it. Nothing goes live until you read the post and press "Merge".
# (Needs Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests". If that is off, the post is still pushed to its own
# branch and GitHub shows a "Compare & pull request" button.)
# Needs the ANTHROPIC_API_KEY repository secret. Cost: one API call per week.
on:
  schedule:
    - cron: '0 8 * * 1'   # Mondays 08:00 UTC
  workflow_dispatch:      # "Run workflow" button for a manual post

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-blog-post
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: pip install anthropic python-dotenv

      - name: Generate next post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python blog_generator.py

      - name: Commit and push new post
        run: |
          git add data/blog/
          if git diff --cached --quiet; then
            echo "No new post generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          BRANCH="blog/draft-$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git commit -m "Draft blog post for review"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Draft blog post for review ($(date -u '+%d %b %Y'))" \
            --body "A new blog post was drafted automatically. Read it in the Files tab, edit anything that is wrong (especially prices and dates), then merge to publish. Close this pull request to discard it." \
            || echo "Could not open the pull request automatically. Open one from branch $BRANCH."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
