name: Weekly search trends report

# Every Wednesday, opens a GitHub issue with what people are searching for:
# rising searches for this site (Google Search Console), the most-searched
# flight destinations from UK and US cities (Aviasales), and trending travel
# searches (Google Trends), plus ideas for pages to write or improve.
# No AI calls. Sections whose secret isn't set are skipped with a note.
on:
  schedule:
    - cron: '41 7 * * 3'   # Wednesdays 07:41 UTC
  workflow_dispatch:       # "Run workflow" button to create this week's report now

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests google-auth

      - name: Build this week's report
        id: build
        env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python scripts/search_trends.py

      - name: Open or refresh this week's report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.build.outputs.title }}
        run: |
          # One issue per period: a re-run refreshes it instead of creating a duplicate
          NUM=$(gh issue list --state all --search "\"$TITLE\" in:title" --json number,title \
                --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file trends.md
            gh issue reopen "$NUM" 2>/dev/null || true
            gh issue comment "$NUM" --body "Report refreshed with the latest data ($(date -u '+%d %b %Y, %H:%M UTC'))."
            echo "Updated existing issue #$NUM"
          else
            gh issue create --title "$TITLE" --body-file trends.md
          fi
