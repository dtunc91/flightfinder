name: Seasonal pages reminder

# On the 1st of every month, opens a GitHub issue listing the seasonal pages to
# refresh before their searches peak (from data/seasonal_calendar.json).
# GitHub emails the repository owner about new issues. Free: no AI calls.
on:
  schedule:
    - cron: '17 7 1 * *'   # 1st of each month, 07:17 UTC
  workflow_dispatch:       # "Run workflow" button to create this month's reminder now

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build this month's reminder
        id: build
        run: python scripts/seasonal_reminder.py

      - name: Open or refresh this month's reminder issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.build.outputs.title }}
        run: |
          # One issue per period: a re-run refreshes it instead of creating a duplicate
          NUM=$(gh issue list --state all --search "\"$TITLE\" in:title" --json number,title \
                --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file reminder.md
            gh issue reopen "$NUM" 2>/dev/null || true
            gh issue comment "$NUM" --body "Reminder refreshed with the latest data ($(date -u '+%d %b %Y, %H:%M UTC'))."
            echo "Updated existing issue #$NUM"
          else
            gh issue create --title "$TITLE" --body-file reminder.md
          fi
